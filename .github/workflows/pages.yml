name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/chelus-header.svg'
      - 'chelus/config.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'assets/chelus-header.svg'
      - 'chelus/config.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test routes, assets, links and content boundaries
        run: python3 -m unittest discover -s website/tests
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: python3 website/build.py --base-path "$PAGES_BASE_PATH" --output website/dist
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
