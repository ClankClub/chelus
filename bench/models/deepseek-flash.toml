# The phone's exact setup: DeepSeek directly, on the owner's DeepSeek key, thinking on at low effort.
# Keep DeepSeek tests here, not on OpenRouter (whose balance is for the cheap non-DeepSeek models).
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
thinking = true
reasoning_effort = "low"
max_tokens = 20000
api_key_env = "DEEPSEEK_API_KEY"
api_key_file = "deepseek.key"
