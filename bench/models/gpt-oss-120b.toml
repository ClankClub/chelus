# OpenAI's open-weight 120B MoE via OpenRouter.
# $0.013 in / $0.047 out per million on OpenRouter (2026-11-01): cheaper than the 20B. The default simulated owner.
provider = "openai"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-oss-120b"
api_key_env = "OPENROUTER_API_KEY"
api_key_file = "openrouter.key"
max_tokens = 8192
